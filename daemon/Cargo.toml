[package]
name = "overseerd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Overseer local agent orchestration daemon"

[[bin]]
name = "overseerd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
regex = "1"
base64 = "0.22"
sha2 = "0.10"
# Gate N, the phone gateway: Noise handshake and transport, WebSocket listener.
snow = "0.10"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
# The reference phone client of the gateway tests.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
