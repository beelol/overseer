[package]
name = "overseer-listener"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Overseer's voice listener: collects audio on the Mac, finds speech, turns it into words and speaks Overseer's answers (Voice Mode, Gate R)"

[[bin]]
name = "overseer-listener"
path = "src/main.rs"

[lib]
name = "overseer_listener"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }
base64 = "0.22"
tempfile = "3"

