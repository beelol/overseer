# A permission request, allowed from the phone.
appId: ${APP}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "agents.screen"
    timeout: 30000
- tapOn:
    id: "agents.needs.${PERMISSION}"
- extendedWaitUntil:
    visible:
      id: "agent.permission.allow"
    timeout: 30000
- tapOn:
    id: "agent.permission.allow"
- extendedWaitUntil:
    notVisible:
      id: "agent.permission.allow"
    timeout: 20000
- tapOn:
    id: "agent.back"
- assertVisible:
    id: "agents.screen"
