# A new agent, started from the phone.
appId: ${APP}
---
- tapOn:
    id: "agents.new"
- extendedWaitUntil:
    visible:
      id: "new.task"
    timeout: 30000
- tapOn:
    id: "new.task"
- inputText: ${TASK}
- tapOn:
    id: "new.start"
- extendedWaitUntil:
    visible:
      id: "agent.list"
    timeout: 30000
- tapOn:
    id: "agent.back"
- extendedWaitUntil:
    visible:
      id: "agents.screen"
    timeout: 10000
