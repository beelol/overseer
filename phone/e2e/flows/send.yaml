# A message typed on the phone: it is in the conversation at once and reaches the agent once.
appId: ${APP}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "agents.screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "agents.row.${SHOWCASE}"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "agents.row.${SHOWCASE}"
- extendedWaitUntil:
    visible:
      id: "agent.composer.text"
    timeout: 30000
- tapOn:
    id: "agent.composer.text"
- inputText: ${MESSAGE}
- tapOn:
    id: "agent.composer.send"
- extendedWaitUntil:
    visible: ".*${MESSAGE}.*"
    timeout: 5000
