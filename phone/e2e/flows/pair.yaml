# Pairing, the way the owner does it on a simulator: the code from the Mac is typed, the Mac
# confirms, and the app is on the agents list. It asks for notifications once, with the reason.
appId: ${APP}
---
# The system has not been asked about notifications yet: the app asks, once, after pairing.
- launchApp:
    permissions:
      notifications: unset
- extendedWaitUntil:
    visible:
      id: "pair.code"
    timeout: 60000
- tapOn:
    id: "pair.name"
- eraseText: 40
- inputText: ${NAME}
- tapOn:
    id: "pair.code"
- inputText: ${CODE}
- tapOn:
    id: "pair.submit"
- extendedWaitUntil:
    visible:
      id: "pair.notifications.reason|agents.screen"
    timeout: 90000
- runFlow:
    when:
      visible:
        id: "pair.notifications.reason"
    commands:
      - takeScreenshot: notifications-the-reason-first
      - tapOn:
          id: "${NOTIFICATIONS}"
      # The system's own question.
      - extendedWaitUntil:
          visible: "Allow"
          timeout: 15000
      - takeScreenshot: the-system-asks-about-notifications
      - tapOn: "Allow"
- extendedWaitUntil:
    visible:
      id: "agents.screen"
    timeout: 30000
