# The Mac moved and the phone cannot find it: the owner types its address. No pairing again.
appId: ${APP}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "agents.screen"
    timeout: 30000
- tapOn:
    id: "agents.menu"
- tapOn:
    id: "agents.menu.settings"
- scrollUntilVisible:
    element:
      id: "settings.mac.address.add"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings.mac.address"
- inputText: ${ADDRESS}
- tapOn:
    id: "settings.mac.address.add"
- scrollUntilVisible:
    element:
      id: "settings.mac.address.0"
    direction: UP
    timeout: 20000
- takeScreenshot: manual-address
