# A notification, tapped: the app opens on that agent.
appId: ${APP}
---
- extendedWaitUntil:
    visible: "Needs your permission"
    timeout: 20000
- tapOn: "Needs your permission"
- extendedWaitUntil:
    visible:
      id: "agent.permission.allow"
    timeout: 30000
- tapOn:
    id: "agent.back"
