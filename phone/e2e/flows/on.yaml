# Phone access is on again: the app is connected by itself, with nothing asked.
appId: ${APP}
---
- extendedWaitUntil:
    notVisible:
      id: "connection.off"
    timeout: 60000
- assertNotVisible:
    id: "connection.unreachable"
- assertNotVisible:
    id: "pair.code"
- scrollUntilVisible:
    element:
      id: "agents.row.${SHOWCASE}"
    direction: DOWN
    timeout: 20000
