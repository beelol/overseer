# An agent's conversation with its menu open. Used by scenarios that go on from it.
appId: ${APP}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "agents.screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "agents.row.${RUN}"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "agents.row.${RUN}"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "agent.more"
    timeout: 30000
- tapOn:
    id: "agent.more"
