# A new agent on a real harness, started from the phone: its model typed, its effort chosen.
appId: ${APP}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "agents.screen"
    timeout: 30000
- tapOn:
    id: "agents.new"
- extendedWaitUntil:
    visible:
      id: "new.task"
    timeout: 30000
- tapOn:
    id: "new.repo"
- tapOn:
    id: "new.repo.${REPO}"
- tapOn:
    id: "new.agent"
- tapOn:
    id: "new.agent.${HARNESS}"
- extendedWaitUntil:
    visible:
      id: "new.model"
    timeout: 20000
- tapOn:
    id: "new.model"
- tapOn:
    id: "new.model.other"
# The form remembers the last model: the field is emptied before the model is typed.
- eraseText: 60
- inputText: ${MODEL}
- tapOn:
    id: "new.model.other.use"
- runFlow:
    when:
      true: ${EFFORT != ''}
    commands:
      - tapOn:
          id: "new.effort"
      - tapOn:
          id: "new.effort.${EFFORT}"
- takeScreenshot: live-${HARNESS}-form
- tapOn:
    id: "new.task"
- inputText: ${TASK}
- tapOn:
    id: "new.start"
- extendedWaitUntil:
    visible:
      id: "agent.screen"
    timeout: 30000
