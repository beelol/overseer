# A message typed while the Mac cannot be reached: it is kept on the phone, shown as queued,
# and sent once when the Mac is back.
appId: ${APP}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "agents.screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "connection.off"
    timeout: 60000
- tapOn:
    id: "agents.row.${SHOWCASE}"
- extendedWaitUntil:
    visible:
      id: "agent.composer.text"
    timeout: 30000
- tapOn:
    id: "agent.composer.text"
- inputText: ${MESSAGE}
- tapOn:
    id: "agent.composer.send"
- extendedWaitUntil:
    visible: ".*${MESSAGE}.*"
    timeout: 5000
- takeScreenshot: queued-while-away
