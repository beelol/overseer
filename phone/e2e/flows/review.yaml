# The agent's changes: the files, one file's hunks, and a hunk marked reviewed.
appId: ${APP}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "agents.screen"
    timeout: 30000
- runFlow:
    file: open-agent.yaml
- extendedWaitUntil:
    visible:
      id: "agent.changes"
    timeout: 30000
- tapOn:
    id: "agent.changes"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "changes.comparison"
    timeout: 30000
# Everything the agent changed since its task started, whatever its latest run did.
- tapOn:
    id: "changes.comparison"
    retryTapIfNoChange: true
- tapOn:
    id: "changes.comparison.menu.task_start"
- extendedWaitUntil:
    visible:
      id: "changes.row.${FILE}"
    timeout: 30000
- tapOn:
    id: "changes.row.${FILE}"
- extendedWaitUntil:
    visible:
      id: "file.hunk.accept"
    timeout: 30000
# Accept, tapped again if the tap is lost (on Android a tap can land as the hunks are drawn again).
# The phone shows the hunk as reviewed at once: its button then takes the mark away, so a tap
# that did land is never repeated.
- repeat:
    times: 3
    while:
      notVisible:
        id: "file\\.hunk\\.accept"
        text: "Unmark reviewed hunk 1"
    commands:
      - tapOn:
          id: "file.hunk.accept"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "file\\.hunk\\.accept"
            text: "Unmark reviewed hunk 1"
          timeout: 6000
          optional: true
- extendedWaitUntil:
    visible:
      id: "file\\.hunk\\.accept"
      text: "Unmark reviewed hunk 1"
    timeout: 20000
- tapOn:
    id: "file.back"
- tapOn:
    id: "changes.back"
