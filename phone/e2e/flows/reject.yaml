# A hunk rejected from the phone: asked once, then the lines are back as they were.
appId: ${APP}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "agents.screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "agents.row.${RUN}"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "agents.row.${RUN}"
- extendedWaitUntil:
    visible:
      id: "agent.changes"
    timeout: 30000
- tapOn:
    id: "agent.changes"
- extendedWaitUntil:
    visible:
      id: "changes.comparison"
    timeout: 30000
# Everything the agent changed since its task started, whatever its latest run did.
- tapOn:
    id: "changes.comparison"
- tapOn:
    id: "changes.comparison.menu.task_start"
- extendedWaitUntil:
    visible:
      id: "changes.row.${FILE}"
    timeout: 30000
- tapOn:
    id: "changes.row.${FILE}"
- extendedWaitUntil:
    visible:
      id: "file.hunk.reject"
    timeout: 30000
- tapOn:
    id: "file.hunk.reject"
    index: 0
- extendedWaitUntil:
    visible:
      id: "file.reject.confirm"
    timeout: 10000
- takeScreenshot: reject-asks-once
- tapOn:
    id: "file.reject.confirm"
