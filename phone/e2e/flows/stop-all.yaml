# Stop all agents: it names how many will stop and asks once.
appId: ${APP}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "agents.screen"
    timeout: 30000
- tapOn:
    id: "agents.menu"
    retryTapIfNoChange: true
# Offered once the phone knows an agent is going: the news may still be on its way.
- extendedWaitUntil:
    visible:
      id: "agents.menu.stop"
    timeout: 20000
- tapOn:
    id: "agents.menu.stop"
- extendedWaitUntil:
    visible:
      id: "agents.stop.confirm"
    timeout: 10000
- takeScreenshot: stop-all-asks-once
- tapOn:
    id: "agents.stop.confirm"
    retryTapIfNoChange: true
