# Stop all agents with the unlock before changes on: asked once, then the device's unlock.
appId: ${APP}
---
- tapOn:
    id: "agents.menu"
    retryTapIfNoChange: true
# Offered once the phone knows an agent is going: the news may still be on its way.
- extendedWaitUntil:
    visible:
      id: "agents.menu.stop"
    timeout: 20000
- tapOn:
    id: "agents.menu.stop"
- extendedWaitUntil:
    visible:
      id: "agents.stop.confirm"
    timeout: 10000
- tapOn:
    id: "agents.stop.confirm"
    retryTapIfNoChange: true
- runFlow:
    file: unlock-prompt.yaml
